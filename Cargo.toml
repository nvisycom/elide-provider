# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    "./crates/elide-bentoml",
    "./crates/elide-deepgram",
    "./crates/elide-gladia",
    "./crates/elide-pioneer",
]
# Python (uv) workspace lives in `packages/`. Excluded so cargo
# doesn't glob-scan it or complain about missing Cargo.toml files.
exclude = ["packages/"]

[workspace.package]
version = "0.1.0"
rust-version = "1.95"
edition = "2024"
license = "Apache-2.0"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/elide-provider"
homepage = "https://github.com/nvisycom/elide-provider"
# The crate is `publish = false`, so docs.rs never builds it; point at the
# in-repo crate docs instead of a docs.rs URL that will always 404.
documentation = "https://github.com/nvisycom/elide-provider/tree/main/crates/elide-bentoml"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Elide crates
elide-core = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-ner = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-audio = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-image = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }

# Derive macros and error handling
thiserror = { version = "2.0", features = [] }

# Primitive datatypes
hipstr = { version = "0.8", features = ["serde"] }

# Encoding and hashing
base64 = { version = "0.23", features = [] }

# Async runtime and parallelism
tokio = { version = "1.50", features = [] }
async-trait = { version = "0.1", features = [] }

# AI / LLM frameworks
bentoml = { version = "0.5", default-features = false, features = ["rustls-tls", "tracing"] }

# Speech-to-text providers without a BentoML service in front of them.
gladia = { version = "0.1", default-features = false, features = ["rustls-tls"] }
deepgram = { version = "0.10", default-features = false, features = ["listen"] }

# HTTP client for providers with no Rust SDK.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
